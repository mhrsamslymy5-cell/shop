# Optional: local Postgres for development (Railway provides its own).
version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurevon
      POSTGRES_PASSWORD: aurevon
      POSTGRES_DB: aurevonfilter
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
